name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlxtend          # enables the reference-parity tests
          pip install -e .

      - name: Test
        # The dataset is not in the repo, so the `slow` tests skip here. They
        # run locally after `python scripts/download_data.py`.
        run: pytest -m "not slow" -q

      - name: Smoke-test the pipeline on the committed sample
        run: mba run -i data/sample/sample_retail.csv --no-figures -q
